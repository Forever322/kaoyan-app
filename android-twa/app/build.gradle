plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaoyan.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.kaoyan.app"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "3.1"
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'kaoyan123'
            keyAlias 'kaoyan'
            keyPassword 'kaoyan123'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
