name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Build web assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf android-twa/app/src/main/assets/*
          cp -r dist/* android-twa/app/src/main/assets/
          # 修复：去除 crossorigin 属性（file:// 协议下不支持 CORS）
          sed -i 's/ crossorigin//g' android-twa/app/src/main/assets/index.html
          echo "=== Fixed index.html ==="
          grep -E '(src=|href=)' android-twa/app/src/main/assets/index.html || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android-twa/release.keystore \
            -alias kaoyan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kaoyan123 -keypass kaoyan123 \
            -dname "CN=Kaoyan, OU=App, O=Kaoyan, L=Beijing, ST=Beijing, C=CN"

      - name: Build release APK
        working-directory: android-twa
        run: gradle assembleRelease

      - name: Determine release tag
        id: release-tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: android-twa/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
