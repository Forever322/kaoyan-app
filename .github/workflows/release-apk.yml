name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android-twa/release.keystore \
            -alias kaoyan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kaoyan123 -keypass kaoyan123 \
            -dname "CN=Kaoyan, OU=App, O=Kaoyan, L=Beijing, ST=Beijing, C=CN"

      - name: Build release APK
        working-directory: android-twa
        run: gradle assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-twa/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
