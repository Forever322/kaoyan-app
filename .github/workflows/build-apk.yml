name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android-twa/release.keystore \
            -alias kaoyan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kaoyan123 -keypass kaoyan123 \
            -dname "CN=Kaoyan, OU=App, O=Kaoyan, L=Beijing, ST=Beijing, C=CN"

      - name: Build release APK
        working-directory: android-twa
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-app-release
          path: android-twa/app/build/outputs/apk/release/app-release.apk
