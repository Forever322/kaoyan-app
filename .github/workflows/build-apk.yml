name: Build Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-twa/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Build web assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # 修复：去除 crossorigin 属性（file:// 协议下不支持 CORS）
          # 先改 dist，Gradle syncWebAssets 二次同步时保留修复
          sed -i 's/ crossorigin//g' dist/index.html
          # assets 目录已不入库（Git 不跟踪空目录），必须先创建
          mkdir -p android-twa/app/src/main/assets
          rm -rf android-twa/app/src/main/assets/*
          cp -r dist/* android-twa/app/src/main/assets/
          echo "=== Fixed index.html ==="
          grep -E '(src=|href=)' android-twa/app/src/main/assets/index.html || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate keystore
        run: |
          rm -f android-twa/release.keystore
          keytool -genkey -v -keystore android-twa/release.keystore \
            -alias kaoyan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kaoyan123 -keypass kaoyan123 \
            -dname "CN=Kaoyan, OU=App, O=Kaoyan, L=Beijing, ST=Beijing, C=CN"

      - name: Build release APK
        working-directory: android-twa
        run: gradle assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: kaoyan-app-release
          path: android-twa/app/build/outputs/apk/release/app-release.apk
