<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="考研择校助手">
  <meta name="theme-color" content="#081326">
  <meta name="description" content="考研择校助手 - 根据分数和分区匹配院校">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <title>考研择校</title>
</head>
<body>
  <div id="app"></div>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalDev = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
      if (isLocalDev) {
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          if (!registrations.length) return;
          await Promise.all(registrations.map((registration) => registration.unregister()));
          if (!sessionStorage.getItem('_local_sw_cleared')) {
            sessionStorage.setItem('_local_sw_cleared', '1');
            location.reload();
          }
        });
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
